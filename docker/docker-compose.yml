services:
  postgres:
    image: postgres:17.9-alpine
    container_name: talent360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talent360
      POSTGRES_PASSWORD: talent360
      POSTGRES_DB: talent360
    ports:
      - "5432:5432"
    volumes:
      - talent360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent360 -d talent360"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  talent360_pgdata:
